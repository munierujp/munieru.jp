name: lighthouse

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      # .npmrcでインストールスクリプトを無効にしているため、明示的に準備する。
      - name: Prepare Nuxt
        run: npm run prepare
      - name: Build
        run: npm run build
      - name: Measure Lighthouse
        id: lighthouse
        run: npm run lighthouse
        env:
          # Ubuntuランナーにインストール済みのChromeを使う。
          CHROME_PATH: /usr/bin/google-chrome
          # CI専用Chromeの起動に必要。公開サイトの設定には影響しない。
          LHCI_COLLECT__SETTINGS__CHROME_FLAGS: --no-sandbox
      - name: Summarize scores
        if: ${{ !cancelled() && steps.lighthouse.outcome == 'success' }}
        run: npm run lighthouse:summary
      - name: Upload Lighthouse reports
        if: ${{ !cancelled() && (steps.lighthouse.outcome == 'success' || steps.lighthouse.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-reports
          path: lighthouse-reports/
          retention-days: 14
          if-no-files-found: warn
